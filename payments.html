<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ETALIO · Payments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    /* ---------- RESET & VARIABLES ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --slate-50: #f8fafc;
      --slate-200: #e2e8f0;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
      --white: #ffffff;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.02);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.04);
      --radius: 0.75rem;
      --success: #22c55e;
      --warning: #eab308;
      --danger: #dc2626;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--slate-50);
      color: var(--slate-900);
      display: flex;
      min-height: 100vh;
    }

    /* ---------- SIDEBAR ---------- */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 260px;
      height: 100vh;
      background: var(--white);
      border-right: 1px solid var(--slate-200);
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease;
      z-index: 50;
      overflow-y: auto;
      box-shadow: var(--shadow-sm);
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 2.5rem;
      padding-left: 0.25rem;
    }

    .brand-icon {
      width: 2.4rem;
      height: 2.4rem;
      background: var(--primary);
      border-radius: 0.65rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.2rem;
      color: white;
      flex-shrink: 0;
    }

    .brand-word {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand-word span {
      color: var(--primary);
    }

    .sidebar-nav {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.7rem 0.9rem;
      border-radius: var(--radius);
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--slate-700);
      text-decoration: none;
      transition: background 0.12s, color 0.12s;
    }

    .sidebar-nav a:hover {
      background: #f1f5f9;
      color: var(--slate-900);
    }
    .sidebar-nav a.active {
      background: #eef2ff;
      color: var(--primary);
      font-weight: 600;
    }

    .sidebar-nav a svg {
      width: 1.25rem;
      height: 1.25rem;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      flex-shrink: 0;
    }

    .sidebar-footer {
      border-top: 1px solid #eef2f6;
      padding-top: 1.2rem;
      font-size: 0.75rem;
      color: var(--slate-600);
    }

    /* ---------- MAIN CONTENT ---------- */
    .main {
      margin-left: 260px;
      flex: 1;
      padding: 1.5rem 2rem 2.5rem;
      min-height: 100vh;
      transition: margin 0.2s;
    }

    /* ---------- TOP NAVBAR ---------- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .menu-toggle {
      background: transparent;
      border: none;
      font-size: 1.6rem;
      padding: 0.2rem 0.4rem;
      cursor: pointer;
      color: var(--slate-800);
      display: none;
      border-radius: 0.5rem;
      line-height: 1;
    }
    .menu-toggle:hover {
      background: #f1f5f9;
    }

    .page-title {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .notification-btn {
      background: transparent;
      border: none;
      padding: 0.4rem;
      cursor: pointer;
      border-radius: 9999px;
      transition: background 0.12s;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .notification-btn:hover {
      background: #f1f5f9;
    }
    .notification-dot {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 0.6rem;
      height: 0.6rem;
      background: var(--danger);
      border-radius: 999px;
      border: 2px solid white;
    }

    .user-menu {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      padding: 0.25rem 0.6rem 0.25rem 0.8rem;
      border-radius: 2rem;
      background: white;
      border: 1px solid var(--slate-200);
      transition: border 0.1s;
      user-select: none;
    }
    .user-menu:hover {
      border-color: #94a3b8;
    }

    .user-avatar {
      width: 2rem;
      height: 2rem;
      background: var(--primary);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 0.8rem;
    }
    .user-name {
      font-weight: 500;
      font-size: 0.9rem;
    }

    .user-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: white;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      min-width: 160px;
      padding: 0.3rem 0;
      display: none;
      z-index: 60;
    }
    .user-dropdown.show {
      display: block;
    }
    .user-dropdown a {
      display: block;
      padding: 0.5rem 1.2rem;
      font-size: 0.85rem;
      color: var(--slate-800);
      text-decoration: none;
      transition: background 0.08s;
    }
    .user-dropdown a:hover {
      background: #f1f5f9;
    }

    /* ---------- PAGE HEADER ---------- */
    .page-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .page-header h2 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    /* ---------- FILTERS ---------- */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      align-items: center;
    }

    .filters input,
    .filters select {
      padding: 0.5rem 0.8rem;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      background: white;
      color: var(--slate-800);
      min-width: 140px;
      transition: border 0.12s, box-shadow 0.12s;
    }

    .filters input:focus,
    .filters select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .filters .search-wrapper {
      position: relative;
      flex: 1;
      min-width: 180px;
    }
    .filters .search-wrapper input {
      width: 100%;
      padding-left: 2.2rem;
      min-width: 0;
    }
    .filters .search-wrapper svg {
      position: absolute;
      left: 0.7rem;
      top: 50%;
      transform: translateY(-50%);
      stroke: var(--slate-600);
      width: 1.1rem;
      height: 1.1rem;
    }

    /* ---------- TABLE ---------- */
    .table-container {
      background: white;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th {
      text-align: left;
      padding: 0.9rem 1rem;
      font-weight: 600;
      color: var(--slate-600);
      border-bottom: 1px solid var(--slate-200);
      background: #fafbfc;
      white-space: nowrap;
    }

    td {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .status-badge {
      display: inline-block;
      padding: 0.2rem 0.7rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: capitalize;
    }

    .status-paid {
      background: #dcfce7;
      color: #166534;
    }
    .status-pending {
      background: #fef9c3;
      color: #854d0e;
    }
    .status-failed {
      background: #fee2e2;
      color: #991b1b;
    }

    .action-btn {
      background: transparent;
      border: none;
      padding: 0.2rem 0.8rem;
      cursor: pointer;
      color: var(--primary);
      border-radius: 0.3rem;
      font-size: 0.8rem;
      font-weight: 500;
      transition: background 0.1s, color 0.1s;
    }
    .action-btn:hover {
      background: #eef2ff;
      color: var(--primary-hover);
    }

    /* ---------- PAGINATION ---------- */
    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1rem 0.8rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .pagination-info {
      font-size: 0.85rem;
      color: var(--slate-600);
    }

    .pagination-buttons {
      display: flex;
      gap: 0.3rem;
    }

    .pagination-buttons button {
      padding: 0.3rem 0.8rem;
      border: 1px solid var(--slate-200);
      background: white;
      border-radius: var(--radius);
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      color: var(--slate-700);
      transition: background 0.1s, border-color 0.1s;
    }

    .pagination-buttons button:hover:not(:disabled) {
      background: #f1f5f9;
      border-color: #94a3b8;
    }

    .pagination-buttons button.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .pagination-buttons button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ---------- MODAL / PAYMENT DETAIL ---------- */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: white;
      border-radius: var(--radius);
      max-width: 560px;
      width: 100%;
      padding: 1.8rem 2rem 2rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h3 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 1.2rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--slate-200);
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      font-size: 0.85rem;
      border-bottom: 1px solid #f1f5f9;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-row .label {
      color: var(--slate-600);
      font-weight: 500;
    }
    .detail-row .value {
      font-weight: 500;
      color: var(--slate-900);
      text-align: right;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 1.2rem;
      padding-top: 0.8rem;
      border-top: 1px solid var(--slate-200);
    }

    .modal-actions .btn-secondary {
      background: transparent;
      border: 1px solid var(--slate-200);
      padding: 0.5rem 1.5rem;
      border-radius: var(--radius);
      font-weight: 500;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      color: var(--slate-700);
      transition: background 0.1s;
    }
    .modal-actions .btn-secondary:hover {
      background: #f1f5f9;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .main {
        margin-left: 0;
        padding: 1rem 1rem 2rem;
      }
      .menu-toggle {
        display: inline-block;
      }
      .page-title {
        font-size: 1.2rem;
      }
      .filters {
        flex-direction: column;
        align-items: stretch;
      }
      .filters .search-wrapper {
        min-width: 0;
      }
      .filters input,
      .filters select {
        min-width: 0;
        width: 100%;
      }
      .page-header {
        flex-direction: column;
        align-items: stretch;
      }
      .pagination {
        flex-direction: column;
        align-items: center;
      }
      .topbar-right {
        gap: 0.75rem;
      }
      .user-name {
        display: none;
      }
      th,
      td {
        padding: 0.6rem 0.5rem;
      }
      .modal {
        padding: 1.2rem;
        margin: 0.5rem;
      }
    }

    @media (max-width: 480px) {
      .table-wrap {
        font-size: 0.75rem;
      }
      th,
      td {
        padding: 0.4rem 0.3rem;
      }
    }

    /* overlay */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.08);
      z-index: 40;
    }
    .overlay.show {
      display: block;
    }
  </style>
</head>
<body>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Sidebar navigation">

  <!-- ===== MAIN ===== -->
  <main class="main" id="mainContent">
    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu" aria-expanded="false">☰</button>

      </div>
      <div class="topbar-right">
        <button class="notification-btn" aria-label="Notifications">
          <svg width="22" height="22" viewBox="0 0 24 24" stroke="#1e293b"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>

    <!-- Page Header -->
    <div class="page-header">
      <h2>Daftar Pembayaran</h2>

    <!-- Filters -->
    <div class="filters">
      <div class="search-wrapper">
        <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search by reference..." />
      </div>
      <select id="statusFilter">
        <option value="">All Status</option>
        <option value="paid">Paid</option>
        <option value="pending">Pending</option>
        <option value="failed">Failed</option>
      </select>
      <select id="methodFilter">
        <option value="">All Method</option>
        <option value="qris">QRIS</option>
        <option value="bank_transfer">Bank Transfer</option>
        <option value="ewallet">E-Wallet</option>
      </select>
      <input type="date" id="dateFilter" />

    <!-- Table -->
    <div class="table-container">

          <thead>

              <th>Reference</th>

      <!-- Pagination -->
      <div class="pagination">

    <!-- ===== PAYMENT DETAIL MODAL ===== -->

      <div class="modal" role="dialog" aria-labelledby="modalTitle" aria-modal="true">
        <h3 id="modalTitle">Payment Detail</h3>
        <div id="detailContent">
          <!-- rendered by JS -->

        <div class="modal-actions">
          <button class="btn-secondary" id="modalCloseBtn">Close</button>

  <script>
    (function() {
      // ---------- MOCK DATA ----------
      const methods = ['qris', 'bank_transfer', 'ewallet'];
      const statuses = ['paid', 'pending', 'failed'];
      const customers = ['Andi Wijaya', 'Siti Rahma', 'Budi Santoso', 'Dewi Lestari', 'Rudi Pratama'];
      const orders = ['#ET-1024', '#ET-1023', '#ET-1022', '#ET-1021', '#ET-1020', '#ET-1019'];

      function randomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

      function randomDate(start, end) {
        const d = new Date(start.getTime() + Math.random() * (end.getTime() - start.getTime()));
        return d.toISOString().slice(0, 10) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes())
          .padStart(2, '0');
      }

      function generatePayments(count) {
        const payments = [];
        for (let i = 1; i <= count; i++) {
          const status = randomItem(statuses);
          const method = randomItem(methods);
          const amount = (Math.floor(Math.random() * 50) + 5) * 10000;
          payments.push({
            id: i,
            reference: 'PAY-2025-' + String(100 + i).padStart(3, '0'),
            order: randomItem(orders),
            amount: amount,
            status: status,
            method: method,
            date: randomDate(new Date(2025, 0, 1), new Date(2025, 1, 28)),
            customer: randomItem(customers),
            gateway: method === 'qris' ? 'QRIS Gateway' : (method === 'bank_transfer' ? 'Bank BCA' : 'E-Wallet X'),
            gatewayRef: 'GATE-' + String(2000 + i) + '-XYZ',
            paidAt: status === 'paid' ? randomDate(new Date(2025, 0, 1), new Date(2025, 1, 28)) : null,
            createdAt: randomDate(new Date(2024, 11, 1), new Date(2025, 0, 31))
          });
        }
        return payments;
      }

      let allPayments = generatePayments(28);
      let filteredPayments = [...allPayments];
      let currentPage = 1;
      const perPage = 5;

      // ---------- DOM REFS ----------
      const tbody = document.getElementById('paymentTableBody');
      const paginationInfo = document.getElementById('paginationInfo');
      const paginationButtons = document.getElementById('paginationButtons');
      const searchInput = document.getElementById('searchInput');
      const statusFilter = document.getElementById('statusFilter');
      const methodFilter = document.getElementById('methodFilter');
      const dateFilter = document.getElementById('dateFilter');

      const detailModal = document.getElementById('detailModal');
      const detailContent = document.getElementById('detailContent');
      const modalCloseBtn = document.getElementById('modalCloseBtn');

      // ---------- HELPERS ----------
      function formatCurrency(amount) {
        return 'Rp ' + amount.toLocaleString('id-ID');
      }

      function formatDate(dateStr) {
        if (!dateStr) return '-';
        return dateStr;
      }

      // ---------- RENDER ----------
      function render() {
        const searchTerm = searchInput.value.toLowerCase().trim();
        const statusVal = statusFilter.value;
        const methodVal = methodFilter.value;
        const dateVal = dateFilter.value;

        filteredPayments = allPayments.filter(p => {
          let match = true;
          if (searchTerm) {
            match = match && p.reference.toLowerCase().includes(searchTerm);
          }
          if (statusVal) {
            match = match && p.status === statusVal;
          }
          if (methodVal) {
            match = match && p.method === methodVal;
          }
          if (dateVal) {
            match = match && p.date.startsWith(dateVal);
          }
          return match;
        });

        // sort by date desc
        filteredPayments.sort((a, b) => b.date.localeCompare(a.date));

        const total = filteredPayments.length;
        const totalPages = Math.ceil(total / perPage) || 1;
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * perPage;
        const end = Math.min(start + perPage, total);
        const pageItems = filteredPayments.slice(start, end);

        // rows
        if (pageItems.length === 0) {
          tbody.innerHTML =
            `<tr><td colspan="7" style="text-align:center; padding:2rem; color: var(--slate-600);">No payments found.</td></tr>`;
        } else {
          tbody.innerHTML = pageItems.map(p => {
            const statusClass = 'status-' + p.status;
            return `
                <tr>
                  <td><strong>${p.reference}</strong></td>
                  <td>${p.order}</td>
                  <td>${formatCurrency(p.amount)}</td>
                  <td><span class="status-badge ${statusClass}">${p.status}</span></td>
                  <td>${p.method.replace('_', ' ').toUpperCase()}</td>
                  <td>${p.date}</td>
                  <td>
                    <button class="action-btn" data-payment-id="${p.id}">Detail</button>
                  </td>
                </tr>
              `;
          }).join('');
        }

        // pagination info
        const startNum = total === 0 ? 0 : start + 1;
        const endNum = end;
        paginationInfo.textContent = `Showing ${startNum}-${endNum} of ${total} payments`;

        // pagination buttons
        let btnsHtml = '';
        btnsHtml += `<button class="page-btn" data-page="prev" ${currentPage <= 1 ? 'disabled' : ''}>‹</button>`;
        for (let i = 1; i <= totalPages; i++) {
          btnsHtml += `<button class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
        }
        btnsHtml += `<button class="page-btn" data-page="next" ${currentPage >= totalPages ? 'disabled' : ''}>›</button>`;
        paginationButtons.innerHTML = btnsHtml;

        // attach detail button events
        document.querySelectorAll('.action-btn[data-payment-id]').forEach(btn => {
          btn.addEventListener('click', function() {
            const id = parseInt(this.getAttribute('data-payment-id'));
            const payment = allPayments.find(p => p.id === id);
            if (payment) openDetail(payment);
          });
        });
      }

      // ---------- PAGINATION ----------
      paginationButtons.addEventListener('click', function(e) {
        const btn = e.target.closest('.page-btn');
        if (!btn) return;
        const page = btn.getAttribute('data-page');
        if (page === 'prev') {
          if (currentPage > 1) { currentPage--;
            render(); }
        } else if (page === 'next') {
          const total = filteredPayments.length;
          const totalPages = Math.ceil(total / perPage);
          if (currentPage < totalPages) { currentPage++;
            render(); }
        } else {
          currentPage = parseInt(page);
          render();
        }
      });

      // ---------- FILTERS ----------
      searchInput.addEventListener('input', function() { currentPage = 1;
        render(); });
      statusFilter.addEventListener('change', function() { currentPage = 1;
        render(); });
      methodFilter.addEventListener('change', function() { currentPage = 1;
        render(); });
      dateFilter.addEventListener('change', function() { currentPage = 1;
        render(); });

      // ---------- DETAIL MODAL ----------
      function openDetail(payment) {
        const statusClass = 'status-' + payment.status;
        detailContent.innerHTML = `
            <div class="detail-row"><span class="label">Reference</span><span class="value">${payment.reference}</span></div>
            <div class="detail-row"><span class="label">Status</span><span class="value"><span class="status-badge ${statusClass}">${payment.status}</span></span></div>
            <div class="detail-row"><span class="label">Amount</span><span class="value">${formatCurrency(payment.amount)}</span></div>
            <div class="detail-row"><span class="label">Order</span><span class="value">${payment.order}</span></div>
            <div class="detail-row"><span class="label">Customer</span><span class="value">${payment.customer}</span></div>
            <div class="detail-row"><span class="label">Method</span><span class="value">${payment.method.replace('_', ' ').toUpperCase()}</span></div>
            <div class="detail-row"><span class="label">Gateway</span><span class="value">${payment.gateway}</span></div>
            <div class="detail-row"><span class="label">Gateway Reference</span><span class="value">${payment.gatewayRef}</span></div>
            <div class="detail-row"><span class="label">Created At</span><span class="value">${payment.createdAt}</span></div>
            <div class="detail-row"><span class="label">Paid At</span><span class="value">${formatDate(payment.paidAt)}</span></div>
          `;
        detailModal.classList.add('show');
        document.body.style.overflow = 'hidden';
      }

      function closeDetail() {
        detailModal.classList.remove('show');
        document.body.style.overflow = '';
      }

      modalCloseBtn.addEventListener('click', closeDetail);
      detailModal.addEventListener('click', function(e) {
        if (e.target === this) closeDetail();
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          if (detailModal.classList.contains('show')) closeDetail();
          if (sidebar.classList.contains('open')) toggleSidebar(false);
        }
      });

      // ---------- SIDEBAR TOGGLE ----------
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      const menuToggle = document.getElementById('menuToggle');

      function toggleSidebar(forceState) {
        const isOpen = (forceState !== undefined) ? forceState : !sidebar.classList.contains('open');
        sidebar.classList.toggle('open', isOpen);
        overlay.classList.toggle('show', isOpen);
        menuToggle.setAttribute('aria-expanded', isOpen);
      }

      menuToggle.addEventListener('click', function(e) {
        e.stopPropagation();
        toggleSidebar();
      });

      overlay.addEventListener('click', function() {
        toggleSidebar(false);
      });

      window.addEventListener('resize', function() {
        if (window.innerWidth > 768) {
          sidebar.classList.remove('open');
          overlay.classList.remove('show');
          menuToggle.setAttribute('aria-expanded', 'false');
        }
      });

      // ---------- USER DROPDOWN ----------
      const userMenu = document.getElementById('userMenu');
      const userDropdown = document.getElementById('userDropdown');

      userMenu.addEventListener('click', function(e) {
        e.stopPropagation();
        const expanded = userMenu.getAttribute('aria-expanded') === 'true';
        userMenu.setAttribute('aria-expanded', !expanded);
        userDropdown.classList.toggle('show');
      });

      document.addEventListener('click', function(e) {
        if (!userMenu.contains(e.target)) {
          userMenu.setAttribute('aria-expanded', 'false');
          userDropdown.classList.remove('show');
        }
      });

      // ---------- INIT ----------
      render();
    })();
  </script>
  <script>if(sessionStorage.getItem('loggedIn')!=='true')location.href='index.html';</script>
</body>
</html>
