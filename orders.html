<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ETALIO · Orders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    /* ---------- RESET & VARIABLES ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --slate-50: #f8fafc;
      --slate-200: #e2e8f0;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
      --white: #ffffff;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.02);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.04);
      --radius: 0.75rem;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--slate-50);
      color: var(--slate-900);
      display: flex;
      min-height: 100vh;
    }

    /* ---------- SIDEBAR (same as dashboard) ---------- */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 260px;
      height: 100vh;
      background: var(--white);
      border-right: 1px solid var(--slate-200);
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease;
      z-index: 50;
      overflow-y: auto;
      box-shadow: var(--shadow-sm);
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 2.5rem;
      padding-left: 0.25rem;
    }

    .brand-icon {
      width: 2.4rem;
      height: 2.4rem;
      background: var(--primary);
      border-radius: 0.65rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.2rem;
      color: white;
      flex-shrink: 0;
    }

    .brand-word {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand-word span {
      color: var(--primary);
    }

    .sidebar-nav {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.7rem 0.9rem;
      border-radius: var(--radius);
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--slate-700);
      text-decoration: none;
      transition: background 0.12s, color 0.12s;
    }

    .sidebar-nav a:hover {
      background: #f1f5f9;
      color: var(--slate-900);
    }
    .sidebar-nav a.active {
      background: #eef2ff;
      color: var(--primary);
      font-weight: 600;
    }

    .sidebar-nav a svg {
      width: 1.25rem;
      height: 1.25rem;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      flex-shrink: 0;
    }

    .sidebar-footer {
      border-top: 1px solid #eef2f6;
      padding-top: 1.2rem;
      font-size: 0.75rem;
      color: var(--slate-600);
    }

    /* ---------- MAIN CONTENT ---------- */
    .main {
      margin-left: 260px;
      flex: 1;
      padding: 1.5rem 2rem 2.5rem;
      min-height: 100vh;
      transition: margin 0.2s;
    }

    /* ---------- TOP NAVBAR ---------- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .menu-toggle {
      background: transparent;
      border: none;
      font-size: 1.6rem;
      padding: 0.2rem 0.4rem;
      cursor: pointer;
      color: var(--slate-800);
      display: none;
      border-radius: 0.5rem;
      line-height: 1;
    }
    .menu-toggle:hover {
      background: #f1f5f9;
    }

    .page-title {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .notification-btn {
      background: transparent;
      border: none;
      padding: 0.4rem;
      cursor: pointer;
      border-radius: 9999px;
      transition: background 0.12s;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .notification-btn:hover {
      background: #f1f5f9;
    }
    .notification-dot {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 0.6rem;
      height: 0.6rem;
      background: #dc2626;
      border-radius: 999px;
      border: 2px solid white;
    }

    .user-menu {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      padding: 0.25rem 0.6rem 0.25rem 0.8rem;
      border-radius: 2rem;
      background: white;
      border: 1px solid var(--slate-200);
      transition: border 0.1s;
      user-select: none;
    }
    .user-menu:hover {
      border-color: #94a3b8;
    }

    .user-avatar {
      width: 2rem;
      height: 2rem;
      background: var(--primary);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 0.8rem;
    }
    .user-name {
      font-weight: 500;
      font-size: 0.9rem;
    }

    .user-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: white;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      min-width: 160px;
      padding: 0.3rem 0;
      display: none;
      z-index: 60;
    }
    .user-dropdown.show {
      display: block;
    }
    .user-dropdown a {
      display: block;
      padding: 0.5rem 1.2rem;
      font-size: 0.85rem;
      color: var(--slate-800);
      text-decoration: none;
      transition: background 0.08s;
    }
    .user-dropdown a:hover {
      background: #f1f5f9;
    }

    /* ---------- PAGE HEADER ---------- */
    .page-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .page-header h2 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: var(--radius);
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.12s, box-shadow 0.12s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }

    /* ---------- FILTERS ---------- */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      align-items: center;
    }

    .filters input,
    .filters select {
      padding: 0.5rem 0.8rem;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      background: white;
      color: var(--slate-800);
      min-width: 140px;
      transition: border 0.12s, box-shadow 0.12s;
    }

    .filters input:focus,
    .filters select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .filters .search-wrapper {
      position: relative;
      flex: 1;
      min-width: 180px;
    }
    .filters .search-wrapper input {
      width: 100%;
      padding-left: 2.2rem;
      min-width: 0;
    }
    .filters .search-wrapper svg {
      position: absolute;
      left: 0.7rem;
      top: 50%;
      transform: translateY(-50%);
      stroke: var(--slate-600);
      width: 1.1rem;
      height: 1.1rem;
    }

    /* ---------- TABLE ---------- */
    .table-container {
      background: white;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th {
      text-align: left;
      padding: 0.9rem 1rem;
      font-weight: 600;
      color: var(--slate-600);
      border-bottom: 1px solid var(--slate-200);
      background: #fafbfc;
      white-space: nowrap;
    }

    td {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .status-badge {
      display: inline-block;
      padding: 0.2rem 0.7rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: capitalize;
    }

    .status-pending {
      background: #fef9c3;
      color: #854d0e;
    }
    .status-confirmed {
      background: #dbeafe;
      color: #1e40af;
    }
    .status-processing {
      background: #e0f2fe;
      color: #0369a1;
    }
    .status-shipped {
      background: #c7d2fe;
      color: #3730a3;
    }
    .status-delivered {
      background: #dcfce7;
      color: #166534;
    }
    .status-completed {
      background: #d1fae5;
      color: #065f46;
    }
    .status-cancelled {
      background: #fee2e2;
      color: #991b1b;
    }

    .action-btn {
      background: transparent;
      border: none;
      padding: 0.2rem 0.5rem;
      cursor: pointer;
      color: var(--slate-600);
      border-radius: 0.3rem;
      font-size: 0.8rem;
      transition: background 0.1s, color 0.1s;
    }
    .action-btn:hover {
      background: #f1f5f9;
      color: var(--slate-900);
    }

    .action-menu-wrapper {
      position: relative;
      display: inline-block;
    }

    .action-dropdown {
      position: absolute;
      right: 0;
      top: calc(100% + 4px);
      background: white;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      min-width: 140px;
      padding: 0.2rem 0;
      display: none;
      z-index: 40;
    }
    .action-dropdown.show {
      display: block;
    }
    .action-dropdown button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.5rem 1rem;
      background: transparent;
      border: none;
      font-size: 0.8rem;
      font-family: 'Inter', sans-serif;
      color: var(--slate-800);
      cursor: pointer;
      transition: background 0.08s;
    }
    .action-dropdown button:hover {
      background: #f1f5f9;
    }

    /* ---------- PAGINATION ---------- */
    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1rem 0.8rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .pagination-info {
      font-size: 0.85rem;
      color: var(--slate-600);
    }

    .pagination-buttons {
      display: flex;
      gap: 0.3rem;
    }

    .pagination-buttons button {
      padding: 0.3rem 0.8rem;
      border: 1px solid var(--slate-200);
      background: white;
      border-radius: var(--radius);
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      color: var(--slate-700);
      transition: background 0.1s, border-color 0.1s;
    }

    .pagination-buttons button:hover:not(:disabled) {
      background: #f1f5f9;
      border-color: #94a3b8;
    }

    .pagination-buttons button.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .pagination-buttons button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .main {
        margin-left: 0;
        padding: 1rem 1rem 2rem;
      }
      .menu-toggle {
        display: inline-block;
      }
      .page-title {
        font-size: 1.2rem;
      }
      .filters {
        flex-direction: column;
        align-items: stretch;
      }
      .filters .search-wrapper {
        min-width: 0;
      }
      .filters input,
      .filters select {
        min-width: 0;
        width: 100%;
      }
      .page-header {
        flex-direction: column;
        align-items: stretch;
      }
      .btn-primary {
        justify-content: center;
      }
      .pagination {
        flex-direction: column;
        align-items: center;
      }
      .topbar-right {
        gap: 0.75rem;
      }
      .user-name {
        display: none;
      }
    }

    @media (max-width: 480px) {
      .table-wrap {
        font-size: 0.75rem;
      }
      th,
      td {
        padding: 0.6rem 0.5rem;
      }
      .action-btn {
        padding: 0.1rem 0.3rem;
      }
    }

    /* overlay */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.08);
      z-index: 40;
    }
    .overlay.show {
      display: block;
    }

    .text-muted {
      color: var(--slate-600);
    }
  </style>
</head>
<body>

  <div class="overlay" id="overlay"></div>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Sidebar navigation">
    <div class="sidebar-brand">
      <div class="brand-icon">E</div>
      <div class="brand-word">ETAL<span>IO</span></div>
    </div>
    <nav class="sidebar-nav">

  <!-- ===== MAIN ===== -->
  <main class="main" id="mainContent">
    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu" aria-expanded="false">☰</button>
        <h1 class="page-title">Orders</h1>
      </div>
      <div class="topbar-right">
        <button class="notification-btn" aria-label="Notifications">
          <svg width="22" height="22" viewBox="0 0 24 24" stroke="#1e293b"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span class="notification-dot"></span>
        </button>
        <div class="user-menu" id="userMenu" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false">
          <div class="user-avatar">A</div>

          <svg width="14" height="14" viewBox="0 0 24 24" stroke="#475569"><polyline points="6 9 12 15 18 9"/></svg>
          <div class="user-dropdown" id="userDropdown">
            <a href="users-detail.html">Profil</a>
            <a href="users-detail.html">Pengaturan</a>
            <a href="#" onclick="sessionStorage.removeItem('loggedIn');location.href='index.html';return false;">Keluar</a>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Header -->
    <div class="page-header">
      <h2>Daftar Pesanan</h2>
      <button class="btn-primary" id="createOrderBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Create Order
      </button>
    </div>

    <!-- Filters -->
    <div class="filters">
      <div class="search-wrapper">
        <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search order number or customer..." />
      </div>
      <select id="statusFilter">
        <option value="">All Status</option>
        <option value="pending">Pending</option>
        <option value="confirmed">Confirmed</option>
        <option value="processing">Processing</option>
        <option value="shipped">Shipped</option>
        <option value="delivered">Delivered</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
      </select>
      <select id="paymentFilter">
        <option value="">All Payment</option>
        <option value="paid">Paid</option>
        <option value="unpaid">Unpaid</option>
        <option value="refunded">Refunded</option>
      </select>
      <input type="date" id="dateFilter" />

    <!-- Table -->
    <div class="table-container">
      <div class="table-wrap">

          <thead>
            <tr>
              <th>Order Number</th>
              <th>Customer</th>
              <th>Total Amount</th>
              <th>Status</th>
              <th>Payment</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="orderTableBody">
            <!-- rows rendered by JS -->
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div class="pagination">
        <div class="pagination-info" id="paginationInfo">Showing 1-5 of 15 orders</div>
        <div class="pagination-buttons" id="paginationButtons"></div>
      </div>
    </div>
  </main>

  <script>
    (function() {
      // ---------- MOCK DATA ----------
      const statuses = ['pending', 'confirmed', 'processing', 'shipped', 'delivered', 'completed', 'cancelled'];
      const customers = ['PT Nusantara', 'CV Karya', 'UD Sumber', 'Fa Berkah', 'Toko Maju', 'Anugrah Shop', 'Budi Santoso',
        'Siti Rahma', 'Andi Wijaya', 'Dewi Lestari'
      ];
      const payments = ['paid', 'unpaid', 'refunded'];

      function randomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

      function formatCurrency(amount) {
        return 'Rp ' + amount.toLocaleString('id-ID');
      }

      function generateOrders(count) {
        const orders = [];
        for (let i = 1; i <= count; i++) {
          const status = randomItem(statuses);
          orders.push({
            id: i,
            orderNumber: 'ET-' + String(1000 + i).padStart(4, '0'),
            customer: randomItem(customers),
            total: Math.round((Math.random() * 5 + 0.5) * 100000) / 100000,
            status: status,
            payment: randomItem(payments),
            date: new Date(Date.now() - Math.random() * 30 * 24 * 60 * 60 * 1000).toISOString().slice(0, 10)
          });
        }
        return orders;
      }

      // ---------- STATE ----------
      let allOrders = generateOrders(35);
      let filteredOrders = [...allOrders];
      let currentPage = 1;
      const perPage = 5;

      // ---------- DOM refs ----------
      const tbody = document.getElementById('orderTableBody');
      const paginationInfo = document.getElementById('paginationInfo');
      const paginationButtons = document.getElementById('paginationButtons');
      const searchInput = document.getElementById('searchInput');
      const statusFilter = document.getElementById('statusFilter');
      const paymentFilter = document.getElementById('paymentFilter');
      const dateFilter = document.getElementById('dateFilter');

      // ---------- render ----------
      function render() {
        // filter
        const searchTerm = searchInput.value.toLowerCase().trim();
        const statusVal = statusFilter.value;
        const paymentVal = paymentFilter.value;
        const dateVal = dateFilter.value;

        filteredOrders = allOrders.filter(order => {
          let match = true;
          if (searchTerm) {
            match = match && (order.orderNumber.toLowerCase().includes(searchTerm) ||
              order.customer.toLowerCase().includes(searchTerm));
          }
          if (statusVal) {
            match = match && (order.status === statusVal);
          }
          if (paymentVal) {
            match = match && (order.payment === paymentVal);
          }
          if (dateVal) {
            match = match && (order.date === dateVal);
          }
          return match;
        });

        // sort by date desc (newest first)
        filteredOrders.sort((a, b) => b.date.localeCompare(a.date));

        // paginate
        const total = filteredOrders.length;
        const totalPages = Math.ceil(total / perPage) || 1;
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * perPage;
        const end = Math.min(start + perPage, total);
        const pageItems = filteredOrders.slice(start, end);

        // render rows
        if (pageItems.length === 0) {
          tbody.innerHTML =
            `<tr><td colspan="6" style="text-align:center; padding:2rem; color: var(--slate-600);">No orders found.</td></tr>`;
        } else {
          tbody.innerHTML = pageItems.map(order => {
            const statusClass = 'status-' + order.status;
            return `
              <tr>
                <td><strong>${order.orderNumber}</strong></td>
                <td>${order.customer}</td>
                <td>${formatCurrency(order.total)}</td>
                <td><span class="status-badge ${statusClass}">${order.status}</span></td>
                <td><span class="status-badge ${order.payment === 'paid' ? 'status-delivered' : order.payment === 'refunded' ? 'status-cancelled' : 'status-pending'}">${order.payment}</span></td>
                <td>
                  <div class="action-menu-wrapper">
                    <button class="action-btn" data-order-id="${order.id}" aria-label="Actions">•••</button>
                    <div class="action-dropdown" data-order-id="${order.id}">
                      <button data-action="view">View Details</button>
                      <button data-action="edit">Edit</button>
                      <button data-action="cancel">Cancel</button>
                    </div>
                  </div>
                </td>
              </tr>
            `;
          }).join('');
        }

        // pagination info
        const startNum = total === 0 ? 0 : start + 1;
        const endNum = end;
        paginationInfo.textContent = `Showing ${startNum}-${endNum} of ${total} orders`;

        // pagination buttons
        let btnsHtml = '';
        btnsHtml += `<button class="page-btn" data-page="prev" ${currentPage <= 1 ? 'disabled' : ''}>‹</button>`;
        for (let i = 1; i <= totalPages; i++) {
          btnsHtml += `<button class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
        }
        btnsHtml += `<button class="page-btn" data-page="next" ${currentPage >= totalPages ? 'disabled' : ''}>›</button>`;
        paginationButtons.innerHTML = btnsHtml;

        // attach event listeners to action dropdowns
        document.querySelectorAll('.action-menu-wrapper').forEach(wrapper => {
          const btn = wrapper.querySelector('.action-btn');
          const dropdown = wrapper.querySelector('.action-dropdown');
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            // close all other dropdowns
            document.querySelectorAll('.action-dropdown.show').forEach(d => {
              if (d !== dropdown) d.classList.remove('show');
            });
            dropdown.classList.toggle('show');
          });
          // dropdown items
          dropdown.querySelectorAll('button').forEach(item => {
            item.addEventListener('click', function(e) {
              e.stopPropagation();
              const action = this.getAttribute('data-action');
              const orderId = parseInt(dropdown.getAttribute('data-order-id'));
              const order = allOrders.find(o => o.id === orderId);
              if (!order) return;
              if (action === 'view') {
                alert(`View order ${order.orderNumber} for ${order.customer}`);
              } else if (action === 'edit') {
                alert(`Edit order ${order.orderNumber}`);
              } else if (action === 'cancel') {
                if (confirm(`Cancel order ${order.orderNumber}?`)) {
                  order.status = 'cancelled';
                  render();
                }
              }
              dropdown.classList.remove('show');
            });
          });
        });

        // close dropdowns on outside click
        document.addEventListener('click', function() {
          document.querySelectorAll('.action-dropdown.show').forEach(d => d.classList.remove('show'));
        });
      }

      // ---------- pagination click ----------
      paginationButtons.addEventListener('click', function(e) {
        const btn = e.target.closest('.page-btn');
        if (!btn) return;
        const page = btn.getAttribute('data-page');
        if (page === 'prev') {
          if (currentPage > 1) { currentPage--;
            render(); }
        } else if (page === 'next') {
          const total = filteredOrders.length;
          const totalPages = Math.ceil(total / perPage);
          if (currentPage < totalPages) { currentPage++;
            render(); }
        } else {
          currentPage = parseInt(page);
          render();
        }
      });

      // ---------- filter events ----------
      searchInput.addEventListener('input', function() { currentPage = 1;
        render(); });
      statusFilter.addEventListener('change', function() { currentPage = 1;
        render(); });
      paymentFilter.addEventListener('change', function() { currentPage = 1;
        render(); });
      dateFilter.addEventListener('change', function() { currentPage = 1;
        render(); });

      // ---------- Create Order ----------
      document.getElementById('createOrderBtn').addEventListener('click', function() {
        window.location.href = 'create-order.html';
      });

      // ---------- sidebar toggle ----------
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      const menuToggle = document.getElementById('menuToggle');

      function toggleSidebar(forceState) {
        const isOpen = (forceState !== undefined) ? forceState : !sidebar.classList.contains('open');
        sidebar.classList.toggle('open', isOpen);
        overlay.classList.toggle('show', isOpen);
        menuToggle.setAttribute('aria-expanded', isOpen);
      }

      menuToggle.addEventListener('click', function(e) {
        e.stopPropagation();
        toggleSidebar();
      });

      overlay.addEventListener('click', function() {
        toggleSidebar(false);
      });

      window.addEventListener('resize', function() {
        if (window.innerWidth > 768) {
          sidebar.classList.remove('open');
          overlay.classList.remove('show');
          menuToggle.setAttribute('aria-expanded', 'false');
        }
      });

      // ---------- user dropdown ----------
      const userMenu = document.getElementById('userMenu');
      const userDropdown = document.getElementById('userDropdown');

      userMenu.addEventListener('click', function(e) {
        e.stopPropagation();
        const expanded = userMenu.getAttribute('aria-expanded') === 'true';
        userMenu.setAttribute('aria-expanded', !expanded);
        userDropdown.classList.toggle('show');
      });

      document.addEventListener('click', function(e) {
        if (!userMenu.contains(e.target)) {
          userMenu.setAttribute('aria-expanded', 'false');
          userDropdown.classList.remove('show');
        }
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          userMenu.setAttribute('aria-expanded', 'false');
          userDropdown.classList.remove('show');
          if (sidebar.classList.contains('open')) toggleSidebar(false);
        }
      });

      // ---------- init ----------
      render();
    })();
  </script>
  <script>if(sessionStorage.getItem('loggedIn')!=='true')location.href='index.html';</script>
</body>
</html>
