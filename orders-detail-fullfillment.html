<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ETALIO · Order Fulfillment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    /* ---------- RESET & VARIABLES ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --slate-50: #f8fafc;
      --slate-200: #e2e8f0;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
      --white: #ffffff;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.02);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.04);
      --radius: 0.75rem;
      --success: #22c55e;
      --warning: #eab308;
      --danger: #dc2626;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--slate-50);
      color: var(--slate-900);
      display: flex;
      min-height: 100vh;
    }

    /* ---------- SIDEBAR ---------- */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 260px;
      height: 100vh;
      background: var(--white);
      border-right: 1px solid var(--slate-200);
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease;
      z-index: 50;
      overflow-y: auto;
      box-shadow: var(--shadow-sm);
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 2.5rem;
      padding-left: 0.25rem;
    }

    .brand-icon {
      width: 2.4rem;
      height: 2.4rem;
      background: var(--primary);
      border-radius: 0.65rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.2rem;
      color: white;
      flex-shrink: 0;
    }

    .brand-word {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand-word span {
      color: var(--primary);
    }

    .sidebar-nav {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.7rem 0.9rem;
      border-radius: var(--radius);
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--slate-700);
      text-decoration: none;
      transition: background 0.12s, color 0.12s;
    }

    .sidebar-nav a:hover {
      background: #f1f5f9;
      color: var(--slate-900);
    }
    .sidebar-nav a.active {
      background: #eef2ff;
      color: var(--primary);
      font-weight: 600;
    }

    .sidebar-nav a svg {
      width: 1.25rem;
      height: 1.25rem;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      flex-shrink: 0;
    }

    .sidebar-footer {
      border-top: 1px solid #eef2f6;
      padding-top: 1.2rem;
      font-size: 0.75rem;
      color: var(--slate-600);
    }

    /* ---------- MAIN CONTENT ---------- */
    .main {
      margin-left: 260px;
      flex: 1;
      padding: 1.5rem 2rem 2.5rem;
      min-height: 100vh;
      transition: margin 0.2s;
    }

    /* ---------- TOP NAVBAR ---------- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .menu-toggle {
      background: transparent;
      border: none;
      font-size: 1.6rem;
      padding: 0.2rem 0.4rem;
      cursor: pointer;
      color: var(--slate-800);
      display: none;
      border-radius: 0.5rem;
      line-height: 1;
    }
    .menu-toggle:hover {
      background: #f1f5f9;
    }

    .page-title {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .notification-btn {
      background: transparent;
      border: none;
      padding: 0.4rem;
      cursor: pointer;
      border-radius: 9999px;
      transition: background 0.12s;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .notification-btn:hover {
      background: #f1f5f9;
    }
    .notification-dot {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 0.6rem;
      height: 0.6rem;
      background: var(--danger);
      border-radius: 999px;
      border: 2px solid white;
    }

    .user-menu {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      padding: 0.25rem 0.6rem 0.25rem 0.8rem;
      border-radius: 2rem;
      background: white;
      border: 1px solid var(--slate-200);
      transition: border 0.1s;
      user-select: none;
    }
    .user-menu:hover {
      border-color: #94a3b8;
    }

    .user-avatar {
      width: 2rem;
      height: 2rem;
      background: var(--primary);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 0.8rem;
    }
    .user-name {
      font-weight: 500;
      font-size: 0.9rem;
    }

    .user-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: white;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      min-width: 160px;
      padding: 0.3rem 0;
      display: none;
      z-index: 60;
    }
    .user-dropdown.show {
      display: block;
    }
    .user-dropdown a {
      display: block;
      padding: 0.5rem 1.2rem;
      font-size: 0.85rem;
      color: var(--slate-800);
      text-decoration: none;
      transition: background 0.08s;
    }
    .user-dropdown a:hover {
      background: #f1f5f9;
    }

    /* ---------- ORDER HEADER ---------- */
    .order-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      gap: 0.8rem;
    }

    .order-header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .order-number {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.9rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: capitalize;
      letter-spacing: 0.02em;
    }

    .status-pending {
      background: #fef9c3;
      color: #854d0e;
    }
    .status-processing {
      background: #e0f2fe;
      color: #0369a1;
    }
    .status-shipped {
      background: #c7d2fe;
      color: #3730a3;
    }
    .status-delivered {
      background: #dcfce7;
      color: #166534;
    }
    .status-completed {
      background: #d1fae5;
      color: #065f46;
    }
    .status-cancelled {
      background: #fee2e2;
      color: #991b1b;
    }

    /* ---------- FULFILLMENT SECTION ---------- */
    .fulfillment-section {
      background: white;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius);
      padding: 1.5rem 2rem 2rem;
      box-shadow: var(--shadow-sm);
      max-width: 820px;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1.2rem;
      color: var(--slate-800);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem 2rem;
      margin-bottom: 1.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--slate-700);
    }

    .form-group select,
    .form-group input {
      padding: 0.5rem 0.8rem;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      background: white;
      color: var(--slate-800);
      transition: border 0.12s, box-shadow 0.12s;
      width: 100%;
    }

    .form-group select:focus,
    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
      margin-top: 0.5rem;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--slate-200);
      padding: 0.5rem 1.5rem;
      border-radius: var(--radius);
      font-weight: 500;
      cursor: pointer;
      transition: background 0.1s;
      font-family: 'Inter', sans-serif;
      color: var(--slate-700);
    }

    .btn-secondary:hover {
      background: #f1f5f9;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.5rem 1.8rem;
      border-radius: var(--radius);
      font-weight: 500;
      cursor: pointer;
      transition: background 0.12s, box-shadow 0.12s;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .spinner {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ---------- TIMELINE ---------- */
    .timeline-section {
      margin-top: 1.8rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--slate-200);
    }

    .timeline-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--slate-700);
      margin-bottom: 1rem;
    }

    .timeline {
      position: relative;
      padding-left: 1.8rem;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 0.35rem;
      top: 0.4rem;
      bottom: 0.4rem;
      width: 2px;
      background: var(--slate-200);
    }

    .timeline-item {
      position: relative;
      padding-bottom: 1.2rem;
      padding-left: 0.8rem;
    }

    .timeline-item:last-child {
      padding-bottom: 0;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -1.5rem;
      top: 0.3rem;
      width: 0.75rem;
      height: 0.75rem;
      border-radius: 999px;
      background: var(--slate-200);
      border: 2px solid white;
      box-shadow: 0 0 0 1px var(--slate-200);
    }

    .timeline-item.active::before {
      background: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
    }

    .timeline-item.completed::before {
      background: var(--success);
      box-shadow: 0 0 0 1px var(--success);
    }

    .timeline-item .event {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--slate-800);
    }

    .timeline-item .desc {
      font-size: 0.8rem;
      color: var(--slate-600);
    }

    .timeline-item .time {
      font-size: 0.7rem;
      color: var(--slate-500);
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .main {
        margin-left: 0;
        padding: 1rem 1rem 2rem;
      }
      .menu-toggle {
        display: inline-block;
      }
      .page-title {
        font-size: 1.2rem;
      }
      .fulfillment-section {
        padding: 1.2rem;
      }
      .form-grid {
        grid-template-columns: 1fr;
        gap: 0.8rem;
      }
      .form-actions {
        flex-direction: column-reverse;
      }
      .form-actions button {
        width: 100%;
        justify-content: center;
      }
      .topbar-right {
        gap: 0.75rem;
      }
      .user-name {
        display: none;
      }
    }

    /* overlay */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.08);
      z-index: 40;
    }
    .overlay.show {
      display: block;
    }
  </style>
</head>
<body>
  <!-- overlay mobile -->
  <div class="overlay" id="overlay"></div>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Sidebar navigation">
    <div class="sidebar-brand">
      <div class="brand-icon">E</div>
      <div class="brand-word">ETAL<span>IO</span></div>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html">
        <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/></svg>
        Dashboard
      </a>
      <a href="orders.html" class="active">
        <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>
        Orders
      </a>
      <a href="products.html">
        <svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20"/></svg>
        Products
      </a>
      <a href="customers.html">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        Customers
      </a>
      <a href="payments.html">
        <svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20"/></svg>
        Payments
      </a>
      <a href="users.html">
        <svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20"/></svg>
        Users
      </a>
    </nav>
    <div class="sidebar-footer">ETALIO v1.0 · Internal</div>
  </aside>

  <!-- ===== MAIN ===== -->
  <main class="main" id="mainContent">
    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu" aria-expanded="false">☰</button>
        <h1 class="page-title">Order Detail</h1>
      </div>
      <div class="topbar-right">
        <button class="notification-btn" aria-label="Notifications">
          <svg width="22" height="22" viewBox="0 0 24 24" stroke="#1e293b"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span class="notification-dot"></span>
        </button>
        <div class="user-menu" id="userMenu" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false">
          <div class="user-avatar">A</div>
          <span class="user-name">Admin</span>
          <svg width="14" height="14" viewBox="0 0 24 24" stroke="#475569"><polyline points="6 9 12 15 18 9"/></svg>
          <div class="user-dropdown" id="userDropdown">
            <a href="users-detail.html">Profil</a>
            <a href="users-detail.html">Pengaturan</a>
            <a href="#" onclick="sessionStorage.removeItem('loggedIn');location.href='index.html';return false;">Keluar</a>
          </div>
        </div>
      </div>
    </header>

    <!-- Order Header (mock) -->
    <div class="order-header">
      <div class="order-header-left">
        <span class="order-number">#ET-1024</span>
        <span class="status-badge status-processing" id="orderStatusBadge">Processing</span>
      </div>
    </div>

    <!-- ===== FULFILLMENT SECTION ===== -->
    <section class="fulfillment-section">
      <h2 class="section-title">Fulfillment</h2>

      <!-- Form -->
      <div class="form-grid">
        <div class="form-group">
          <label for="fulfillmentStatus">Fulfillment Status</label>
          <select id="fulfillmentStatus">
            <option value="processing">Processing</option>
            <option value="shipped">Shipped</option>
            <option value="delivered">Delivered</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <div class="form-group">
          <label for="courier">Courier</label>
          <select id="courier">
            <option value="">Select courier</option>
            <option value="JNE">JNE</option>
            <option value="Tiki">Tiki</option>
            <option value="SiCepat">SiCepat</option>
            <option value="J&T">J&T</option>
            <option value="Pos Indonesia">Pos Indonesia</option>
          </select>
        </div>
        <div class="form-group" style="grid-column: 1 / -1;">
          <label for="trackingNumber">Tracking Number</label>
          <input type="text" id="trackingNumber" placeholder="Enter tracking number" />
        </div>
      </div>

      <div class="form-actions">
        <button class="btn-secondary" id="resetBtn">Reset</button>
        <button class="btn-primary" id="saveBtn">
          <span id="saveText">Save</span>
          <span id="saveSpinner" class="spinner" style="display:none;"></span>
        </button>
      </div>

      <!-- Timeline -->
      <div class="timeline-section">
        <div class="timeline-title">Fulfillment Timeline</div>
        <div class="timeline" id="timelineContainer">
          <!-- rendered by JS -->
        </div>
      </div>
    </section>
  </main>

  <script>
    (function() {
      // ---------- MOCK DATA ----------
      const order = {
        id: 1024,
        number: '#ET-1024',
        status: 'processing', // initial status
        fulfillment: {
          status: 'processing',
          courier: 'JNE',
          trackingNumber: 'TRK-2025-001',
          timeline: [
            { event: 'Processing', description: 'Order is being prepared', time: '2025-02-09 08:00',
            done: true },
            { event: 'Shipped', description: 'Order shipped by courier', time: '', done: false },
            { event: 'Delivered', description: 'Order delivered to customer', time: '', done: false },
            { event: 'Completed', description: 'Order completed', time: '', done: false }
          ]
        }
      };

      // ---------- DOM REFS ----------
      const statusSelect = document.getElementById('fulfillmentStatus');
      const courierSelect = document.getElementById('courier');
      const trackingInput = document.getElementById('trackingNumber');
      const saveBtn = document.getElementById('saveBtn');
      const saveText = document.getElementById('saveText');
      const saveSpinner = document.getElementById('saveSpinner');
      const resetBtn = document.getElementById('resetBtn');
      const timelineContainer = document.getElementById('timelineContainer');
      const orderStatusBadge = document.getElementById('orderStatusBadge');

      // ---------- HELPERS ----------
      function getStatusClass(status) {
        return 'status-' + status;
      }

      function formatDate(dateStr) {
        if (!dateStr) return '—';
        return dateStr;
      }

      // ---------- RENDER TIMELINE ----------
      function renderTimeline() {
        const timeline = order.fulfillment.timeline;
        // determine current active index based on fulfillment status
        const statusMap = {
          'processing': 0,
          'shipped': 1,
          'delivered': 2,
          'completed': 3
        };
        const currentIdx = statusMap[order.fulfillment.status] !== undefined ? statusMap[order.fulfillment.status] : 0;

        timelineContainer.innerHTML = timeline.map((item, index) => {
          let cls = 'timeline-item';
          if (item.done) cls += ' completed';
          else if (index === currentIdx && !item.done) cls += ' active';

          return `
              <div class="${cls}">
                <div class="event">${item.event}</div>
                <div class="desc">${item.description}</div>
                <div class="time">${formatDate(item.time)}</div>
              </div>
            `;
        }).join('');
      }

      // ---------- UPDATE ORDER STATUS BADGE ----------
      function updateOrderBadge() {
        const status = order.fulfillment.status;
        orderStatusBadge.textContent = status.charAt(0).toUpperCase() + status.slice(1);
        orderStatusBadge.className = 'status-badge ' + getStatusClass(status);
        // also update order main status
        order.status = status;
      }

      // ---------- LOAD FORM ----------
      function loadForm() {
        statusSelect.value = order.fulfillment.status;
        courierSelect.value = order.fulfillment.courier || '';
        trackingInput.value = order.fulfillment.trackingNumber || '';
        renderTimeline();
        updateOrderBadge();
      }

      // ---------- SAVE (with loading) ----------
      function handleSave() {
        const newStatus = statusSelect.value;
        const newCourier = courierSelect.value;
        const newTracking = trackingInput.value.trim();

        // basic validation
        if (!newCourier) {
          alert('Please select a courier.');
          return;
        }
        if (!newTracking) {
          alert('Please enter a tracking number.');
          return;
        }

        // show loading
        saveBtn.disabled = true;
        saveText.textContent = 'Saving...';
        saveSpinner.style.display = 'inline-block';

        // mock API call
        setTimeout(() => {
          // update data
          order.fulfillment.status = newStatus;
          order.fulfillment.courier = newCourier;
          order.fulfillment.trackingNumber = newTracking;

          // update timeline: mark steps as done based on status
          const statusMap = {
            'processing': 0,
            'shipped': 1,
            'delivered': 2,
            'completed': 3
          };
          const currentIdx = statusMap[newStatus] !== undefined ? statusMap[newStatus] : 0;
          order.fulfillment.timeline.forEach((item, index) => {
            item.done = index <= currentIdx;
            if (index === currentIdx && !item.time) {
              item.time = new Date().toISOString().slice(0, 16).replace('T', ' ');
            }
          });

          // re-render
          renderTimeline();
          updateOrderBadge();

          // reset loading
          saveBtn.disabled = false;
          saveText.textContent = 'Save';
          saveSpinner.style.display = 'none';

          alert('Fulfillment updated successfully!');
        }, 1200);
      }

      // ---------- RESET ----------
      function handleReset() {
        if (confirm('Reset to current saved state?')) {
          loadForm();
        }
      }

      // ---------- EVENT LISTENERS ----------
      saveBtn.addEventListener('click', handleSave);
      resetBtn.addEventListener('click', handleReset);

      // ---------- SIDEBAR TOGGLE ----------
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      const menuToggle = document.getElementById('menuToggle');

      function toggleSidebar(forceState) {
        const isOpen = (forceState !== undefined) ? forceState : !sidebar.classList.contains('open');
        sidebar.classList.toggle('open', isOpen);
        overlay.classList.toggle('show', isOpen);
        menuToggle.setAttribute('aria-expanded', isOpen);
      }

      menuToggle.addEventListener('click', function(e) {
        e.stopPropagation();
        toggleSidebar();
      });

      overlay.addEventListener('click', function() {
        toggleSidebar(false);
      });

      window.addEventListener('resize', function() {
        if (window.innerWidth > 768) {
          sidebar.classList.remove('open');
          overlay.classList.remove('show');
          menuToggle.setAttribute('aria-expanded', 'false');
        }
      });

      // ---------- USER DROPDOWN ----------
      const userMenu = document.getElementById('userMenu');
      const userDropdown = document.getElementById('userDropdown');

      userMenu.addEventListener('click', function(e) {
        e.stopPropagation();
        const expanded = userMenu.getAttribute('aria-expanded') === 'true';
        userMenu.setAttribute('aria-expanded', !expanded);
        userDropdown.classList.toggle('show');
      });

      document.addEventListener('click', function(e) {
        if (!userMenu.contains(e.target)) {
          userMenu.setAttribute('aria-expanded', 'false');
          userDropdown.classList.remove('show');
        }
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          userMenu.setAttribute('aria-expanded', 'false');
          userDropdown.classList.remove('show');
          if (sidebar.classList.contains('open')) toggleSidebar(false);
        }
      });

      // ---------- INIT ----------
      loadForm();
    })();
  </script>
  <script>if(sessionStorage.getItem('loggedIn')!=='true')location.href='index.html';</script>
</body>
</html>
