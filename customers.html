<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ETALIO · Customers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    /* ---------- RESET & VARIABLES ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --slate-50: #f8fafc;
      --slate-200: #e2e8f0;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
      --white: #ffffff;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.02);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.04);
      --radius: 0.75rem;
      --success: #22c55e;
      --warning: #eab308;
      --danger: #dc2626;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--slate-50);
      color: var(--slate-900);
      display: flex;
      min-height: 100vh;
    }

    /* ---------- SIDEBAR ---------- */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 260px;
      height: 100vh;
      background: var(--white);
      border-right: 1px solid var(--slate-200);
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease;
      z-index: 50;
      overflow-y: auto;
      box-shadow: var(--shadow-sm);
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 2.5rem;
      padding-left: 0.25rem;
    }

    .brand-icon {
      width: 2.4rem;
      height: 2.4rem;
      background: var(--primary);
      border-radius: 0.65rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.2rem;
      color: white;
      flex-shrink: 0;
    }

    .brand-word {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand-word span {
      color: var(--primary);
    }

    .sidebar-nav {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.7rem 0.9rem;
      border-radius: var(--radius);
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--slate-700);
      text-decoration: none;
      transition: background 0.12s, color 0.12s;
    }

    .sidebar-nav a:hover {
      background: #f1f5f9;
      color: var(--slate-900);
    }
    .sidebar-nav a.active {
      background: #eef2ff;
      color: var(--primary);
      font-weight: 600;
    }

    .sidebar-nav a svg {
      width: 1.25rem;
      height: 1.25rem;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      flex-shrink: 0;
    }

    .sidebar-footer {
      border-top: 1px solid #eef2f6;
      padding-top: 1.2rem;
      font-size: 0.75rem;
      color: var(--slate-600);
    }

    /* ---------- MAIN CONTENT ---------- */
    .main {
      margin-left: 260px;
      flex: 1;
      padding: 1.5rem 2rem 2.5rem;
      min-height: 100vh;
      transition: margin 0.2s;
    }

    /* ---------- TOP NAVBAR ---------- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .menu-toggle {
      background: transparent;
      border: none;
      font-size: 1.6rem;
      padding: 0.2rem 0.4rem;
      cursor: pointer;
      color: var(--slate-800);
      display: none;
      border-radius: 0.5rem;
      line-height: 1;
    }
    .menu-toggle:hover {
      background: #f1f5f9;
    }

    .page-title {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .notification-btn {
      background: transparent;
      border: none;
      padding: 0.4rem;
      cursor: pointer;
      border-radius: 9999px;
      transition: background 0.12s;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .notification-btn:hover {
      background: #f1f5f9;
    }
    .notification-dot {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 0.6rem;
      height: 0.6rem;
      background: var(--danger);
      border-radius: 999px;
      border: 2px solid white;
    }

    .user-menu {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      padding: 0.25rem 0.6rem 0.25rem 0.8rem;
      border-radius: 2rem;
      background: white;
      border: 1px solid var(--slate-200);
      transition: border 0.1s;
      user-select: none;
    }
    .user-menu:hover {
      border-color: #94a3b8;
    }

    .user-avatar {
      width: 2rem;
      height: 2rem;
      background: var(--primary);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 0.8rem;
    }
    .user-name {
      font-weight: 500;
      font-size: 0.9rem;
    }

    .user-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: white;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      min-width: 160px;
      padding: 0.3rem 0;
      display: none;
      z-index: 60;
    }
    .user-dropdown.show {
      display: block;
    }
    .user-dropdown a {
      display: block;
      padding: 0.5rem 1.2rem;
      font-size: 0.85rem;
      color: var(--slate-800);
      text-decoration: none;
      transition: background 0.08s;
    }
    .user-dropdown a:hover {
      background: #f1f5f9;
    }

    /* ---------- PAGE HEADER ---------- */
    .page-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .page-header h2 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: var(--radius);
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.12s, box-shadow 0.12s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }

    /* ---------- FILTERS ---------- */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      align-items: center;
    }

    .filters .search-wrapper {
      position: relative;
      flex: 1;
      min-width: 220px;
    }
    .filters .search-wrapper input {
      width: 100%;
      padding: 0.5rem 0.8rem 0.5rem 2.2rem;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      background: white;
      color: var(--slate-800);
      transition: border 0.12s, box-shadow 0.12s;
      min-width: 0;
    }
    .filters .search-wrapper input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }
    .filters .search-wrapper svg {
      position: absolute;
      left: 0.7rem;
      top: 50%;
      transform: translateY(-50%);
      stroke: var(--slate-600);
      width: 1.1rem;
      height: 1.1rem;
    }

    /* ---------- TABLE ---------- */
    .table-container {
      background: white;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th {
      text-align: left;
      padding: 0.9rem 1rem;
      font-weight: 600;
      color: var(--slate-600);
      border-bottom: 1px solid var(--slate-200);
      background: #fafbfc;
      white-space: nowrap;
    }

    td {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .customer-cell {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .customer-avatar {
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 999px;
      background: #eef2ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.75rem;
      color: var(--primary);
      flex-shrink: 0;
    }

    .customer-name {
      font-weight: 500;
    }

    .status-badge {
      display: inline-block;
      padding: 0.2rem 0.7rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: capitalize;
    }

    .status-active {
      background: #dcfce7;
      color: #166534;
    }
    .status-inactive {
      background: #fee2e2;
      color: #991b1b;
    }
    .status-vip {
      background: #fef9c3;
      color: #854d0e;
    }

    .action-btn {
      background: transparent;
      border: none;
      padding: 0.2rem 0.5rem;
      cursor: pointer;
      color: var(--slate-600);
      border-radius: 0.3rem;
      font-size: 0.8rem;
      transition: background 0.1s, color 0.1s;
    }
    .action-btn:hover {
      background: #f1f5f9;
      color: var(--slate-900);
    }

    .action-menu-wrapper {
      position: relative;
      display: inline-block;
    }

    .action-dropdown {
      position: absolute;
      right: 0;
      top: calc(100% + 4px);
      background: white;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      min-width: 140px;
      padding: 0.2rem 0;
      display: none;
      z-index: 40;
    }
    .action-dropdown.show {
      display: block;
    }
    .action-dropdown button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.5rem 1rem;
      background: transparent;
      border: none;
      font-size: 0.8rem;
      font-family: 'Inter', sans-serif;
      color: var(--slate-800);
      cursor: pointer;
      transition: background 0.08s;
    }
    .action-dropdown button:hover {
      background: #f1f5f9;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .main {
        margin-left: 0;
        padding: 1rem 1rem 2rem;
      }
      .menu-toggle {
        display: inline-block;
      }
      .page-title {
        font-size: 1.2rem;
      }
      .filters {
        flex-direction: column;
        align-items: stretch;
      }
      .filters .search-wrapper {
        min-width: 0;
      }
      .page-header {
        flex-direction: column;
        align-items: stretch;
      }
      .btn-primary {
        justify-content: center;
      }
      .topbar-right {
        gap: 0.75rem;
      }
      .user-name {
        display: none;
      }
      th,
      td {
        padding: 0.6rem 0.5rem;
      }
    }

    @media (max-width: 480px) {
      .table-wrap {
        font-size: 0.75rem;
      }
      th,
      td {
        padding: 0.4rem 0.3rem;
      }
      .customer-avatar {
        width: 1.8rem;
        height: 1.8rem;
        font-size: 0.6rem;
      }
    }

    /* overlay */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.08);
      z-index: 40;
    }
    .overlay.show {
      display: block;
    }

    .text-muted {
      color: var(--slate-600);
    }
  </style>
</head>
<body>
  <!-- overlay mobile -->
  <div class="overlay" id="overlay"></div>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Sidebar navigation">
    <div class="sidebar-brand">
      <div class="brand-icon">E</div>
      <div class="brand-word">ETAL<span>IO</span></div>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html">
        <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/></svg>
        Dashboard
      </a>
      <a href="orders.html">
        <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>

      </a>
      <a href="products.html">
        <svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20"/></svg>
        Products
      </a>
      <a href="customers.html" class="active">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        Customers
      </a>

        <svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20"/></svg>

      </a>
    </nav>
    <div class="sidebar-footer">ETALIO v1.0 · Internal</div>
  </aside>

  <!-- ===== MAIN ===== -->
  <main class="main" id="mainContent">
    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu" aria-expanded="false">☰</button>
        <h1 class="page-title">Customers</h1>
      </div>
      <div class="topbar-right">
        <button class="notification-btn" aria-label="Notifications">
          <svg width="22" height="22" viewBox="0 0 24 24" stroke="#1e293b"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span class="notification-dot"></span>
        </button>
        <div class="user-menu" id="userMenu" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false">
          <div class="user-avatar">A</div>
          <span class="user-name">Admin</span>
          <svg width="14" height="14" viewBox="0 0 24 24" stroke="#475569"><polyline points="6 9 12 15 18 9"/></svg>
          <div class="user-dropdown" id="userDropdown">
            <a href="users-detail.html">Profil</a>
            <a href="users-detail.html">Pengaturan</a>
            <a href="#" onclick="sessionStorage.removeItem('loggedIn');location.href='index.html';return false;">Keluar</a>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Header -->
    <div class="page-header">
      <h2>Daftar Pelanggan</h2>
      <button class="btn-primary" id="addCustomerBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Customer
      </button>
    </div>

    <!-- Search -->
    <div class="filters">
      <div class="search-wrapper">
        <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search by name, phone, or email..." />
      </div>
    </div>

    <!-- Table -->
    <div class="table-container">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Customer</th>
              <th>Phone</th>
              <th>Email</th>
              <th>Order Count</th>
              <th>Last Order</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="customerTableBody">
            <!-- rendered by JS -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    (function() {
      // ---------- MOCK DATA ----------
      const statuses = ['active', 'inactive', 'vip'];
      const firstNames = ['Andi', 'Siti', 'Budi', 'Dewi', 'Rudi', 'Ani', 'Joko', 'Maya', 'Tono', 'Rina'];
      const lastNames = ['Wijaya', 'Rahma', 'Santoso', 'Lestari', 'Pratama', 'Sari', 'Kusuma', 'Putri', 'Hidayat', 'Ningsih'];

      function randomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

      function randomDate(start, end) {
        const d = new Date(start.getTime() + Math.random() * (end.getTime() - start.getTime()));
        return d.toISOString().slice(0, 10);
      }

      function generateCustomers(count) {
        const customers = [];
        const used = new Set();
        for (let i = 1; i <= count; i++) {
          const firstName = randomItem(firstNames);
          const lastName = randomItem(lastNames);
          let name = firstName + ' ' + lastName;
          let counter = 1;
          while (used.has(name)) {
            name = firstName + ' ' + lastName + ' ' + counter++;
          }
          used.add(name);
          const phone = '+62 812-' + String(1000 + Math.floor(Math.random() * 9000)) + '-' + String(1000 + Math.floor(Math
          .random() * 9000));
          const email = name.toLowerCase().replace(/ /g, '.') + '@example.com';
          const orderCount = Math.floor(Math.random() * 25) + 1;
          const lastOrder = randomDate(new Date(2024, 11, 1), new Date(2025, 1, 28));
          const status = randomItem(statuses);
          customers.push({
            id: i,
            name: name,
            phone: phone,
            email: email,
            orderCount: orderCount,
            lastOrder: lastOrder,
            status: status
          });
        }
        return customers;
      }

      let allCustomers = generateCustomers(22);
      let filteredCustomers = [...allCustomers];

      // ---------- DOM REFS ----------
      const tbody = document.getElementById('customerTableBody');
      const searchInput = document.getElementById('searchInput');

      // ---------- RENDER ----------
      function render() {
        const searchTerm = searchInput.value.toLowerCase().trim();

        filteredCustomers = allCustomers.filter(c => {
          return c.name.toLowerCase().includes(searchTerm) ||
            c.phone.includes(searchTerm) ||
            c.email.toLowerCase().includes(searchTerm);
        });

        if (filteredCustomers.length === 0) {
          tbody.innerHTML =
            `<tr><td colspan="7" style="text-align:center; padding:2rem; color: var(--slate-600);">No customers found.</td></tr>`;
          return;
        }

        tbody.innerHTML = filteredCustomers.map(customer => {
          const initial = customer.name.charAt(0).toUpperCase();
          const statusClass = 'status-' + customer.status;
          const statusLabel = customer.status.charAt(0).toUpperCase() + customer.status.slice(1);

          return `
              <tr>
                <td>
                  <div class="customer-cell">
                    <div class="customer-avatar">${initial}</div>
                    <span class="customer-name">${customer.name}</span>
                  </div>
                </td>
                <td>${customer.phone}</td>
                <td>${customer.email}</td>
                <td>${customer.orderCount}</td>
                <td>${customer.lastOrder}</td>
                <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
                <td>
                  <div class="action-menu-wrapper">
                    <button class="action-btn" data-customer-id="${customer.id}" aria-label="Actions">•••</button>
                    <div class="action-dropdown" data-customer-id="${customer.id}">
                      <button data-action="view">View Details</button>
                      <button data-action="edit">Edit</button>
                      <button data-action="toggle">${customer.status === 'active' ? 'Deactivate' : 'Activate'}</button>
                      <button data-action="delete">Delete</button>
                    </div>
                  </div>
                </td>
              </tr>
            `;
        }).join('');

        // attach action dropdown events
        document.querySelectorAll('.action-menu-wrapper').forEach(wrapper => {
          const btn = wrapper.querySelector('.action-btn');
          const dropdown = wrapper.querySelector('.action-dropdown');
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            document.querySelectorAll('.action-dropdown.show').forEach(d => {
              if (d !== dropdown) d.classList.remove('show');
            });
            dropdown.classList.toggle('show');
          });

          dropdown.querySelectorAll('button').forEach(item => {
            item.addEventListener('click', function(e) {
              e.stopPropagation();
              const action = this.getAttribute('data-action');
              const customerId = parseInt(dropdown.getAttribute('data-customer-id'));
              const customer = allCustomers.find(c => c.id === customerId);
              if (!customer) return;

              if (action === 'view') {
                window.location.href = 'customer-detail.html';
              } else if (action === 'edit') {
                alert(`Edit customer: ${customer.name}`);
              } else if (action === 'toggle') {
                customer.status = customer.status === 'active' ? 'inactive' : 'active';
                render();
                alert(`Customer ${customer.name} status changed to ${customer.status}`);
              } else if (action === 'delete') {
                if (confirm(`Delete customer ${customer.name}?`)) {
                  allCustomers = allCustomers.filter(c => c.id !== customerId);
                  render();
                  alert(`Customer ${customer.name} deleted.`);
                }
              }
              dropdown.classList.remove('show');
            });
          });
        });

        // close dropdowns on outside click
        document.addEventListener('click', function() {
          document.querySelectorAll('.action-dropdown.show').forEach(d => d.classList.remove('show'));
        });
      }

      // ---------- SEARCH ----------
      searchInput.addEventListener('input', render);

      // ---------- ADD CUSTOMER ----------
      document.getElementById('addCustomerBtn').addEventListener('click', function() {
        window.location.href = 'customer-detail.html';
      });

      // ---------- SIDEBAR TOGGLE ----------
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      const menuToggle = document.getElementById('menuToggle');

      function toggleSidebar(forceState) {
        const isOpen = (forceState !== undefined) ? forceState : !sidebar.classList.contains('open');
        sidebar.classList.toggle('open', isOpen);
        overlay.classList.toggle('show', isOpen);
        menuToggle.setAttribute('aria-expanded', isOpen);
      }

      menuToggle.addEventListener('click', function(e) {
        e.stopPropagation();
        toggleSidebar();
      });

      overlay.addEventListener('click', function() {
        toggleSidebar(false);
      });

      window.addEventListener('resize', function() {
        if (window.innerWidth > 768) {
          sidebar.classList.remove('open');
          overlay.classList.remove('show');
          menuToggle.setAttribute('aria-expanded', 'false');
        }
      });

      // ---------- USER DROPDOWN ----------
      const userMenu = document.getElementById('userMenu');
      const userDropdown = document.getElementById('userDropdown');

      userMenu.addEventListener('click', function(e) {
        e.stopPropagation();
        const expanded = userMenu.getAttribute('aria-expanded') === 'true';
        userMenu.setAttribute('aria-expanded', !expanded);
        userDropdown.classList.toggle('show');
      });

      document.addEventListener('click', function(e) {
        if (!userMenu.contains(e.target)) {
          userMenu.setAttribute('aria-expanded', 'false');
          userDropdown.classList.remove('show');
        }
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          userMenu.setAttribute('aria-expanded', 'false');
          userDropdown.classList.remove('show');
          if (sidebar.classList.contains('open')) toggleSidebar(false);
        }
      });

      // ---------- INIT ----------
      render();
    })();
  </script>
  <script>if(sessionStorage.getItem('loggedIn')!=='true')location.href='index.html';</script>
</body>
</html>
